# Only references, never inline secret values. Loaded once by the server.
credentials:
  company-app:
    githubApp:
      appId: 12345
      installationId: 67890
      privateKeyFile: /run/secrets/github-app.pem
      # Alternative to privateKeyFile: privateKeyEnv: FRD_COMPANY_APP_PRIVATE_KEY
  personal-token:
    token:
      valueEnv: FRD_PERSONAL_GITHUB_TOKEN
      # Alternative to valueEnv: valueFile: /run/secrets/github-token
