name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run all checks
        run: mise run check

  github-e2e:
    name: GitHub discovery E2E
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Discover live GitHub fixtures
        env:
          FRD_E2E_GITHUB_TOKEN: ${{ secrets.FRD_E2E_GITHUB_TOKEN }}
        run: mise run test-e2e

  release-check:
    name: Release packaging and image smoke test
    needs: [checks, github-e2e]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.github-e2e.result == 'success' || needs.github-e2e.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Fork and Dependabot PRs receive a read-only token.
      PUBLISH_IMAGE: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      - name: Check out tested source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build snapshot archives and images without publishing
        run: mise exec -- goreleaser release --snapshot --clean

      - name: Verify checksums and packaged image
        run: |
          version="$(jq -r .version dist/metadata.json)"
          (cd dist && sha256sum --check checksums.txt)
          for arch in amd64 arm64; do
            image="ghcr.io/vterdunov/flux-repository-discovery:${version}-${arch}"
            actual_arch="$(docker image inspect --format '{{.Architecture}}' "$image")"
            test "$actual_arch" = "$arch"
          done
          image="ghcr.io/vterdunov/flux-repository-discovery:${version}-amd64"
          test "$(docker run --rm "$image" version)" = "$version"

      - name: Generate development image tags
        if: env.PUBLISH_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=long

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested snapshot images
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          version="$(jq -er .version dist/metadata.json)"
          image="ghcr.io/vterdunov/flux-repository-discovery"
          sources=()
          for arch in amd64 arm64; do
            target="${image}:sha-${GITHUB_SHA}-${arch}"
            docker tag "${image}:${version}-${arch}" "$target"
            docker push "$target"
            digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er .digest)"
            sources+=("${image}@${digest}")
          done
          tags=()
          while IFS= read -r tag; do
            test -z "$tag" || tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published development manifests
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker buildx imagetools inspect "$tag" --raw | jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]'
          done <<< "$IMAGE_TAGS"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, github-e2e, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag on main history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${prerelease_id}(\.${prerelease_id})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $pattern ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or a prerelease tag, without build metadata.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .draft")"
          if [[ -n "$draft" && "$draft" != true ]]; then
            echo 'This version is already published. Release a new version instead.' >&2
            exit 1
          fi

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifacts, publish image and upload draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- goreleaser release --clean

      - name: Publish the completed GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
