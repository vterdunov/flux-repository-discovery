name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run all checks
        run: mise run check

  github-e2e:
    name: GitHub discovery E2E
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Discover live GitHub fixtures
        env:
          FRD_E2E_GITHUB_TOKEN: ${{ secrets.FRD_E2E_GITHUB_TOKEN }}
        run: mise run test-e2e

  release-check:
    name: Release packaging and image smoke test
    needs: [checks, github-e2e]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.github-e2e.result == 'success' || needs.github-e2e.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Fork and Dependabot PRs receive a read-only token.
      PUBLISH_IMAGE: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build snapshot archives and images without publishing
        run: goreleaser release --snapshot --clean

      - name: Verify checksums and packaged image
        id: snapshot
        run: |
          version="$(jq -er .version dist/metadata.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum --check checksums.txt)
          for arch in amd64 arm64; do
            image="ghcr.io/vterdunov/flux-repository-discovery:${version}-${arch}"
            actual_arch="$(docker image inspect --format '{{.Architecture}}' "$image")"
            test "$actual_arch" = "$arch"
          done
          image="ghcr.io/vterdunov/flux-repository-discovery:${version}-amd64"
          test "$(docker run --rm "$image" version)" = "$version"

      - name: Prepare prebuilt binaries for Docker
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          for arch in amd64 arm64; do
            binary="$(jq -er --arg arch "$arch" '.[] | select(.type == "Binary" and .extra.ID == "discovery" and .goos == "linux" and .goarch == $arch) | .path' dist/artifacts.json)"
            mkdir -p "dist/container/linux/$arch"
            cp "$binary" "dist/container/linux/$arch/flux-repository-discovery"
          done

      - name: Generate development image tags
        if: env.PUBLISH_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.snapshot.outputs.version }}

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        if: env.PUBLISH_IMAGE == 'true'
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist/container
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published development manifests
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker buildx imagetools inspect "$tag" --raw | jq -e '
              [.manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .platform | "\(.os)/\(.architecture)"]
              | sort == ["linux/amd64", "linux/arm64"]'
          done <<< "$IMAGE_TAGS"

      - name: Sign and verify development image
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, github-e2e, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag on main history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${prerelease_id}(\.${prerelease_id})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $pattern ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or a prerelease tag, without build metadata.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .draft")"
          if [[ -n "$draft" && "$draft" != true ]]; then
            echo 'This version is already published. Release a new version instead.' >&2
            exit 1
          fi

      - name: Install tools from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifacts, publish image and upload draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Verify release image signature
        run: |
          image="ghcr.io/vterdunov/flux-repository-discovery"
          digest="$(docker buildx imagetools inspect "$image:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -er .digest)"
          cosign verify "$image@$digest" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish the completed GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
