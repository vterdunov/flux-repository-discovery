[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
actionlint = "1.7.12"
goreleaser = "2.18.1"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go-mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.test]
description = "Run unit and component tests"
run = "go test ./..."

[tasks.race]
description = "Run tests with the Go race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Lint Go code, including CLI integration and E2E tests"
run = "golangci-lint run --build-tags=integration,e2e ./..."

[tasks.lint-ci]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.lint-release]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks.release-snapshot]
description = "Build release archives and checksums locally without publishing or Docker"
run = "goreleaser release --snapshot --clean --skip=publish,docker"

[tasks.dev]
description = "Run the service with local config.yaml and credentials.yaml"
run = "go run ./cmd/flux-repository-discovery serve --config config.yaml --credentials-file credentials.yaml"

[tasks.build]
description = "Build the CLI into bin/"
run = "go build -o bin/flux-repository-discovery ./cmd/flux-repository-discovery"

[tasks.test-cli]
description = "Build and test the real CLI/HTTP process, including SIGTERM (Linux/macOS)"
run = "go test -race -tags=integration -count=1 -timeout=2m ./integration/cli"

[tasks.test-e2e]
description = "Discover private GitHub fixtures through the real binary (requires FRD_E2E_GITHUB_TOKEN)"
run = "go test -race -tags=e2e -count=1 -v -timeout=8m ./integration/cli"

[tasks.check]
description = "Run unit, race and CLI tests, linters, release validation and build"
depends = ["test", "race", "lint", "lint-ci", "lint-release", "build", "test-cli"]
