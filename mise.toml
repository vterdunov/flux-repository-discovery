[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
actionlint = "1.7.12"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go-mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.test]
run = "go test ./..."

[tasks.race]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run --build-tags=integration,e2e ./..."

[tasks.lint-ci]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.build]
run = "go build -o bin/flux-repository-discovery ./cmd/flux-repository-discovery"

[tasks.test-cli]
description = "Build and test the real CLI/HTTP process, including SIGTERM (Linux/macOS)"
run = "go test -race -tags=integration -count=1 -timeout=2m ./integration/cli"

[tasks.test-e2e]
description = "Discover private GitHub fixtures through the real binary (requires FRD_E2E_GITHUB_TOKEN)"
run = "go test -race -tags=e2e -count=1 -v -timeout=8m ./integration/cli"

[tasks.check]
depends = ["test", "race", "lint", "lint-ci", "build", "test-cli"]
